# Secrets (DB passwords, Resend, storage API keys) live in project-root .env.
# See .env.example. Values below are local-dev fallbacks only; .env wins at runtime.
auth:
  enabled: true
  # Longer default so players can check email during the configuration-phase gate.
  timeout-seconds: 600
  # v1 default: require explicit login every connection (bound UUID is still enforced).
  auto-login-bound-uuid: false
  database:
    jdbc-url: "jdbc:postgresql://127.0.0.1:5433/larpsmp"
    username: "larpsmp"
    password: "larpsmp"
    pool-size: 5
  signup:
    enabled: true
    min-password-length: 8
    max-password-length: 64
    min-username-length: 3
    max-username-length: 16
  rate-limit:
    max-attempts: 5
    window-seconds: 300
  email:
    code-length: 6
    code-ttl-seconds: 600
    resend-cooldown-seconds: 60
    max-verify-attempts: 5
