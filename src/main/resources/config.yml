auth:
  enabled: true
  timeout-seconds: 120
  # v1 default: require explicit login every connection (bound UUID is still enforced).
  auto-login-bound-uuid: false
  database:
    jdbc-url: "jdbc:postgresql://127.0.0.1:5433/larpsmp"
    username: "larpsmp"
    password: "larpsmp"
    pool-size: 5
  signup:
    enabled: true
    min-password-length: 8
    max-password-length: 64
    min-username-length: 3
    max-username-length: 16
  rate-limit:
    max-attempts: 5
    window-seconds: 300
  messages:
    login-title: "Login"
    login-body: "Sign in to join LarpSMP."
    login-identifier-label: "Username or email"
    login-password-label: "Password"
    login-submit: "Log in"
    login-open-signup: "Sign up"
    login-invalid-credentials: "Invalid username/email or password."
    login-empty-fields: "Enter your username/email and password."
    login-uuid-bound-other: "This Minecraft profile is already linked to another account."
    login-account-bound-other: "This account is linked to a different Minecraft profile."
    login-rate-limited: "Too many failed attempts. Please wait and try again."
    login-internal-error: "Authentication is temporarily unavailable. Please try again later."
    signup-title: "Sign up"
    signup-body: "Create an account. All fields are required."
    signup-username-label: "Username"
    signup-email-label: "Email"
    signup-password-label: "Password"
    signup-submit: "Create account"
    signup-back: "Back to login"
    signup-empty-fields: "Username, email, and password are all required."
    signup-invalid-username: "Username must be 3-16 characters: letters, numbers, or underscore."
    signup-invalid-email: "Enter a valid email address."
    signup-invalid-password: "Password must be between 8 and 64 characters."
    signup-username-taken: "That username is already taken."
    signup-email-taken: "That email is already registered."
    signup-disabled: "Account creation is currently disabled."
    signup-rate-limited: "Too many failed attempts. Please wait and try again."
    signup-internal-error: "Account creation is temporarily unavailable. Please try again later."
    uuid-already-bound: "This Minecraft profile is already linked to an account. Please log in instead."
    back-to-menu: "Back to main menu"
    disconnect-cancelled: "Returned to the main menu."
    disconnect-timeout: "Authentication timed out. Please reconnect and try again."
    disconnect-denied: "Authentication required to join this server."
    disconnect-missing-profile: "Unable to authenticate: missing player profile."
    disconnect-database-unavailable: "Authentication is unavailable. Please try again later."
