name: MoneyEvent
version: '${version}'
main: com.larpsmp.moneyevent.MoneyEventPlugin
api-version: '1.21'
description: Local development foundation for the LarpSMP money event.
author: LarpSMP
libraries:
  - org.postgresql:postgresql:42.7.4
  - com.zaxxer:HikariCP:6.2.1
  - org.bouncycastle:bcprov-jdk18on:1.79
commands:
  balance:
    description: Shows your own or another registered player's balance.
    usage: /balance [player]
  pay:
    description: Pays a registered player from your wallet.
    usage: /pay <player> <amount>
  top:
    description: Shows public team, personal wealth, or kill standings.
    usage: /top <teams|money|kills>
  team:
    description: Shows your team roster and team wealth.
    usage: /team [balance]
  help:
    description: Lists LarpSMP player commands.
    usage: /help
    aliases: [larphelp]
  bid:
    description: Place a bid on the open auction lot (representatives only).
    usage: /bid <amount>
  auction:
    description: Player auction actions (pay after winning a lot).
    usage: /auction pay
  larp:
    description: Protected LarpSMP administration commands (money, kill money, visibility, account ops, capture, spawn, auction, ace hunt, teams).
    usage: /larp <money|killmoney|killreward|visibility|op|deop|ops|capture|spawn|auction|acehunt|teams|team|captain|tier> ...
