name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: larpsmp
          POSTGRES_USER: larpsmp
          POSTGRES_PASSWORD: larpsmp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U larpsmp -d larpsmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARPSMP_JDBC_URL: jdbc:postgresql://127.0.0.1:5433/larpsmp
      LARPSMP_DB_USER: larpsmp
      LARPSMP_DB_PASSWORD: larpsmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant Gradle wrapper
        run: chmod +x gradlew
      - name: Test
        run: ./gradlew --no-daemon cleanTest test
      - name: Build JAR
        run: ./gradlew --no-daemon build -x test
